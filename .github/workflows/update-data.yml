name: Update data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull data
        run: python scripts/update_data.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Run the model
        run: python scripts/run_model.py
      - name: Show a sample game
        if: always()
        run: |
          python scripts/show_game.py | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```'; python scripts/show_picks.py; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "prop-exchange-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
