name: Update data

# Daily refresh, Tuesday through Sunday. 15:00 UTC is 10 AM Eastern in winter
# (11 AM during daylight time), before every 1 PM kickoff. Thursday and Sunday
# games get their prop lines on this run; Monday games get theirs on the
# pre-kickoff run instead. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 15 * * 0,2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull data
        run: python scripts/update_data.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Run the model
        # still runs if one data source failed: the model uses the last good copy
        if: ${{ !cancelled() }}
        run: python scripts/run_model.py
      - name: Storylines (just for fun, not modeled)
        if: ${{ !cancelled() }}
        run: python scripts/update_storylines.py
      - name: Show a sample game
        if: always()
        run: |
          python scripts/show_game.py | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```'; python scripts/show_picks.py; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "prop-exchange-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  publish:
    needs: update
    if: always()
    uses: ./.github/workflows/pages.yml
