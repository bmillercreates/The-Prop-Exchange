name: Grade picks

# Manual grading. Normally the game-day runner (gameday.yml) grades each game
# about 3 hours 20 minutes after kickoff; use this to regrade or to check one
# game's box score.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Optional: a game id to just print its box score (no grading)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gameday
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check one box score
        if: inputs.check != ''
        run: python scripts/grade.py --check ${{ inputs.check }}
      - name: Grade finished games
        if: inputs.check == ''
        run: python scripts/grade.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save data to the repo
        if: inputs.check == ''
        run: |
          git config user.name "prop-exchange-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Graded picks $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  publish:
    needs: grade
    if: inputs.check == ''
    uses: ./.github/workflows/pages.yml
