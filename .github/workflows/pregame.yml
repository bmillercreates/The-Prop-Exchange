name: Game-day runner backup check

# Backup only. The game-day runner (gameday.yml) does the real work and keeps
# itself going; the daily update starts it. GitHub skips many of these
# frequent scheduled checks, but whenever one does run, it makes sure the
# runner is alive.
on:
  schedule:
    - cron: "7,37 0-4,12-23 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/kick_gameday.sh
        env:
          GH_TOKEN: ${{ github.token }}
